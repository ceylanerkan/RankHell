# Test profili: paylasilan Aiven MySQL yerine bellek ici H2.
# MODE=MySQL, entity'lerdeki MySQL'e ozgu tanimlarin (TEXT, TIMESTAMP DEFAULT
# CURRENT_TIMESTAMP) H2 tarafindan da anlasilmasini saglar.
spring.datasource.url=jdbc:h2:mem:rankback-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sema her testte sifirdan uretilir; gercek veritabaninda ddl-auto=update ile
# yapilamayan degisiklikler (user_id'nin NULL olabilir hale gelmesi) burada
# dogal olarak dogru sekilde olusur.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

jwt.secret=test-only-secret-key-that-is-long-enough-for-hmac-sha512-signing-1234567890
jwt.expiration-ms=3600000
