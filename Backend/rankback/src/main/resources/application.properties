spring.application.name=rankback

# JPA / Hibernate Configurations
# ddl-auto=validate: Hibernate artık şema OLUŞTURMAZ, sadece entity ile şemanın
# uyumunu kontrol eder. Şema yönetimi tamamen Flyway'e devredildi.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Profil: mysql profilini aktif et → application-mysql.properties okunur.
# Not: Bu değer SPRING_PROFILES_ACTIVE ortam değişkeniyle override edilebilir.
# Test ortamında @ActiveProfiles("test") ile geçersiz kılınır.
spring.profiles.active=mysql

# Flyway: şema versiyonlama
# baseline-on-migrate=true → mevcut bir DB'ye ilk kez Flyway tanıtılırken
# var olan tabloları silmeden V1'i başlangıç noktası olarak işaretler.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT Configuration
# jwt.secret: dev-only fallback below. In real deployments this MUST come from an
# environment variable (JWT_SECRET) or a secrets manager -- never hardcode/commit
# a production signing key.
jwt.secret=${JWT_SECRET:Dyyog+0eA63T9YbM6UrxwkB0nJN9AYOffohso0DX6/kaaWUQ+Xve/qOlT47CNaEW}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: Vite dev sunucusu farkli bir port'ta calistigi icin tarayici izin ister.
# Yayina cikarken CORS_ALLOWED_ORIGINS ile gercek alan adi verilmeli.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
