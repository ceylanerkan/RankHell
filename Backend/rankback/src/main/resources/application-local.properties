# Yerel gelistirme veritabani (localhost MySQL).
#
# Neden var: ortak Aiven sunucusu ara ara erisilemez oluyor ve gelistirme
# testleri ortak veritabanina test verisi yaziyordu. Bu profille gelistirme
# tamamen yerelde doner, ortak veritabani sadece takim verisi icin kalir.
#
# Calistirma:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Buradaki sifre gizli bilgi degil: yalnizca localhost'taki gelistirme
# veritabanina ait. Ortak/yayin ortamlarinin sifresi asla dosyaya yazilmaz,
# ortam degiskeninden gelir -- asagidaki ${...:varsayilan} kalibi ikisini de
# destekler.
spring.datasource.url=jdbc:mysql://localhost:3306/rankhell?sslMode=DISABLED&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME:rankhell}
spring.datasource.password=${DB_PASSWORD:rankhell_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Yerelde sema uretimi serbest: bozarsan veritabanini silip yeniden kurarsin.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
